# Build and publish to PyPI on a version tag, via PyPI Trusted Publishing
# (OIDC) -- no API token is stored in this repo.
#
# One-time setup on pypi.org (Your projects -> pyanglemania -> Publishing, or
# https://pypi.org/manage/account/publishing/ for the very first release):
#   Owner: BIMSBbioinfo | Repository: pyanglemania
#   Workflow: publish.yml | Environment: pypi
#
# Release: bump `version` in pyproject.toml, commit, then
#   git tag v0.1.0 && git push origin v0.1.0
name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(ls dist/*.tar.gz | sed -E 's/.*pyanglemania-(.*)\.tar\.gz/\1/')
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match pyproject version $pkg" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
