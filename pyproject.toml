[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "pyanglemania"
description = "GPU-accelerated, scanpy/rapids-singlecell-native port of the anglemania feature-selection algorithm for scRNA-seq dataset integration."
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = [ "LICENSE" ]
authors = [
    { name = "Aaron Kollotzek", email = "aaron.kollotzek@mdc-berlin.de" },
]
readme = "README.md"
keywords = [
    "anndata",
    "batch-integration",
    "bioinformatics",
    "feature-selection",
    "gpu",
    "scanpy",
    "single-cell",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "anndata>=0.10.0",
    "scanpy>=1.10.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas",
]
version = "0.1.0"

[project.optional-dependencies]
rapids = [ "cupy-cuda12x" ]
test = [ "pytest" ]

[project.urls]
Homepage = "https://github.com/BIMSBbioinfo/pyanglemania"
Repository = "https://github.com/BIMSBbioinfo/pyanglemania"
Issues = "https://github.com/BIMSBbioinfo/pyanglemania/issues"
"Original R package" = "https://github.com/BIMSBbioinfo/anglemania"

[tool.hatch.build.targets.wheel]
packages = [ "src/pyanglemania" ]

# Keep the sdist to the package plus what makes it reproducible/reviewable.
# Without this, hatchling would also ship the repo's local-only reference
# material (`ref_packages/` is ~1.1GB of upstream git checkouts, and is
# untracked rather than gitignored, so VCS-based exclusion doesn't catch it).
[tool.hatch.build.targets.sdist]
only-include = [
    "src/pyanglemania",
    "tests",
    "notebooks/tutorial.ipynb",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = [ "tests" ]

[tool.ruff]
src = [ "src" ]
